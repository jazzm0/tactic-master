plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.tacticmaster'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.tacticmaster"
        minSdk = 24
        targetSdk = 37
        versionCode = 45
        versionName = "1.0.45"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
        options.deprecation = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warningsAsErrors = true
        checkDependencies = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.preference
    implementation libs.chesslib

    // Force a current androidx.lifecycle: the 2.6.2 bundled lint check is compiled
    // against an obsolete lint API (14) and fails lintRelease under AGP 9 (lint API 16).
    constraints {
        implementation(libs.lifecycle.runtime)
        implementation(libs.lifecycle.runtime.ktx)
    }
    implementation libs.androidsvg
    implementation libs.acra.core
    implementation libs.acra.mail
    implementation libs.acra.toast

    testImplementation libs.junit
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testImplementation libs.junit.jupiter.params
    testImplementation libs.junit.platform.launcher
    testImplementation libs.androidx.junit
    testImplementation libs.mockito.core

    androidTestImplementation libs.androidx.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.androidx.espresso.core
}